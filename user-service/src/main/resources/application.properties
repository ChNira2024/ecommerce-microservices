spring.application.name=user-service

server.port=8103


#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce-microservices
spring.datasource.username=postgres
spring.datasource.password=sisu

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Actuator(Expose all endpoint in local to test, but in production we expose only "health,beans,logger,metrics,info" for security reason)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
#management.endpoint.shutdown.enabled=true

#Customize actuator "info" endpoint
info.app.name=This is User Service
info.app.description=This is ecomm project build by us
info.app.version=3.5.13

#EUREKA ENABLE
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Log File
logging.file.name=logs/user-service.log
logging.level.root=INFO
logging.level.com.niranjana=DEBUG

# Max file size before rotation
logging.logback.rollingpolicy.max-file-size=10MB
# Keep history (number of files)
logging.logback.rollingpolicy.max-history=7
# Total size cap (optional but recommended)
logging.logback.rollingpolicy.total-size-cap=100MB
