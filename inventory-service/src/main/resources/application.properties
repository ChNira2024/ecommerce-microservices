spring.application.name=inventory-service


server.port=8108

#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce-microservices
spring.datasource.username=postgres
spring.datasource.password=sisu

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Actuator(Expose all endpoint in local to test, but in production we expose only "health,beans,logger,metrics,info" for security reason)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
#management.endpoint.shutdown.enabled=true

#Customize actuator "info" endpoint
info.app.name=This is Inventory Service
info.app.description=This is ecomm project build by us
info.app.version=3.5.13


#Log file
logging.file.name=logs/inventory-service.log
logging.level.root=INFO
logging.level.com.niranjana=DEBUG


# Max file size before rotation
logging.logback.rollingpolicy.max-file-size=10MB
# Keep history (number of files)
logging.logback.rollingpolicy.max-history=7
# Total size cap (optional but recommended)
logging.logback.rollingpolicy.total-size-cap=100MB

# Consumer
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.niranjana.ecommerce.inventory.consumer.event.OrderEvent

# Producer (for next step: payment)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Inventory Consumer Consume Topics From Producer(Order)
kafka.topic.order-created=order-topic-microservices-producer

#Inventory Producer Own Topic
kafka.topic.inventory-success=inventory-success
kafka.topic.inventory-failed=inventory-failed