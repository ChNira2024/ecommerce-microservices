server:
  port: 8107

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/cart/**
                
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
                    

#EUREKA ENABLE
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: 'true'
      
                   